name: Publish Verba for Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Confirm tag matches application version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $packageVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $packageVersion) {
            throw "Tag version v$tagVersion must match package.json version $packageVersion."
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check internationalization resources
        run: pnpm run i18n:check

      - name: Build installer
        run: pnpm run release

      - name: Create or update GitHub Release
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Verba $version" --generate-notes --latest
          }
          gh release upload $tag "dist/Verba-Setup-$version.exe" "dist/Verba-Setup-$version.exe.blockmap" "dist/latest.yml" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
